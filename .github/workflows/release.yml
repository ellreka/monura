name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag matches application versions
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const versions = { package: packageVersion, tauri: tauriVersion, cargo: cargoVersion };
          if (new Set(Object.values(versions)).size !== 1 || process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match application versions ${JSON.stringify(versions)}`);
          }
          NODE

  build-macos:
    name: Build macOS artifact without Developer ID
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install stable Rust for Apple Silicon
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-apple-darwin --toolchain stable
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/create-release-config.mjs .github/tauri.release.json

      - name: Build macOS release artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_ENABLED: "true"
        with:
          uploadUpdaterJson: false
          args: --target aarch64-apple-darwin --bundles app,dmg --config .github/tauri.release.json

      - name: Store macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monura-macos-release
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

      - name: Remove updater configuration
        if: always()
        run: rm -f .github/tauri.release.json

  build-windows:
    name: Build unsigned Windows artifact
    if: ${{ vars.RELEASE_WINDOWS == 'true' }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/create-release-config.mjs .github/tauri.release.json

      - name: Build Windows release artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER_ENABLED: "true"
        with:
          uploadUpdaterJson: false
          args: --bundles nsis --config .github/tauri.release.json

      - name: Store Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monura-windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0

      - name: Remove updater configuration
        if: always()
        shell: pwsh
        run: Remove-Item ".github/tauri.release.json" -Force -ErrorAction SilentlyContinue

  publish:
    name: Create draft GitHub Release
    needs:
      - build-macos
      - build-windows
    if: ${{ always() && needs.build-macos.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monura-macos-release
          path: release-assets

      - name: Download Windows artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monura-windows-release
          path: release-assets
      - name: Prepare updater manifest and release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/create-updater-release.mjs release-assets release-upload

      - name: Create draft release
        env:
          EXPECTED_ASSET_COUNT: ${{ needs.build-windows.result == 'success' && 6 || 4 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release-upload/*)
          if (( ${#assets[@]} != EXPECTED_ASSET_COUNT )); then
            echo "Expected exactly $EXPECTED_ASSET_COUNT release assets, found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft \
            --generate-notes \
            --title "Monura $GITHUB_REF_NAME" \
            --verify-tag
